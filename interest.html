<!DOCTYPE html>
<html>
<head>
    <title>EasyLife - Interest Calculator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 13px 25px;
            margin: 10px 5px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>💰 Interest Calculator</h1>
        <p>Calculate simple interest easily</p>
    </div>

    <div class="box">

        <input type="number" id="amount" placeholder="Principal Amount (₹)">

        <input type="number" id="rate" placeholder="Interest Rate (% per year)">

        <input type="number" id="years" placeholder="Time (Years)">

        <br>

        <button onclick="calculateInterest()">Calculate Interest</button>

        <div id="result"></div>

        <button onclick="goHome()">🏠 Home</button>

    </div>

    <script>

        function calculateInterest() {

            let amount = Number(document.getElementById("amount").value);
            let rate = Number(document.getElementById("rate").value);
            let years = Number(document.getElementById("years").value);

            if (!amount || !rate || !years) {
                alert("Please enter all details");
                return;
            }

            let interest = (amount * rate * years) / 100;
            let total = amount + interest;

            document.getElementById("result").innerHTML =
                "💰 Interest: ₹" + interest.toFixed(2) +
                "<br>💵 Total Amount: ₹" + total.toFixed(2);
        }

        function goHome() {
            window.location.href = "home.html";
        }

    </script>

</body>
</html>
