<!DOCTYPE html>
<html>
<head>
    <title>EasyLife - Photo Resize</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        input, select {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 13px 25px;
            margin: 10px 5px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }

        #preview {
            max-width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📏 Photo Resize</h1>
        <p>Resize your photo easily</p>
    </div>

    <div class="box">

        <input type="file" id="photo" accept="image/*">

        <br>

        <input type="number" id="width" placeholder="Width (px)">

        <input type="number" id="height" placeholder="Height (px)">

        <br>

        <button onclick="resizePhoto()">Resize Photo</button>

        <br>

        <canvas id="canvas" style="display:none;"></canvas>

        <img id="preview">

        <br>

        <button onclick="goHome()">🏠 Home</button>

    </div>

    <script>

        function resizePhoto() {

            const file = document.getElementById("photo").files[0];

            const width = document.getElementById("width").value;
            const height = document.getElementById("height").value;

            if (!file) {
                alert("Please select a photo");
                return;
            }

            if (!width || !height) {
                alert("Please enter width and height");
                return;
            }

            const img = new Image();

            img.onload = function() {

                const canvas = document.getElementById("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img, 0, 0, width, height);

                const preview = document.getElementById("preview");

                preview.src = canvas.toDataURL("image/jpeg", 0.95);

                const link = document.createElement("a");

                link.download = "EasyLife-Resized-Photo.jpg";
                link.href = canvas.toDataURL("image/jpeg", 0.95);

                link.click();
            };

            img.src = URL.createObjectURL(file);
        }

        function goHome() {
            window.location.href = "home.html";
        }

    </script>

</body>
</html>
