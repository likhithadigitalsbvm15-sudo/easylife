<!DOCTYPE html>
<html>
<head>
    <title>Password Generator - EasyLife</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #0d47a1;
        }

        .length {
            width: 80%;
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }

        .option {
            text-align: left;
            margin: 12px auto;
            max-width: 280px;
            font-size: 16px;
        }

        .option input {
            width: auto;
            margin-right: 8px;
        }

        #password {
            width: 90%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #0d47a1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2196f3;
        }

        .back {
            background: #555;
        }

        .back:hover {
            background: #777;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔐 Password Generator</h1>

    <p>Create a strong random password</p>

    <label>
        <b>Password Length:</b>

        <select id="length" class="length">
            <option value="8">8</option>
            <option value="12" selected>12</option>
            <option value="16">16</option>
            <option value="20">20</option>
            <option value="24">24</option>
        </select>
    </label>

    <div class="option">
        <label>
            <input type="checkbox" id="uppercase" checked>
            🔠 Capital Letters
        </label>
    </div>

    <div class="option">
        <label>
            <input type="checkbox" id="lowercase" checked>
            🔡 Small Letters
        </label>
    </div>

    <div class="option">
        <label>
            <input type="checkbox" id="numbers" checked>
            🔢 Numbers
        </label>
    </div>

    <div class="option">
        <label>
            <input type="checkbox" id="symbols" checked>
            🔣 Symbols
        </label>
    </div>

    <input
        type="text"
        id="password"
        readonly
        placeholder="Your password will appear here"
    >

    <br>

    <button onclick="generatePassword()">
        🔐 Generate Password
    </button>

    <button onclick="copyPassword()">
        📋 Copy
    </button>

    <br>

    <button class="back" onclick="location.href='home.html'">
        ← Back to EasyLife
    </button>

</div>

<script>

function generatePassword() {

    const length = parseInt(
        document.getElementById("length").value
    );

    const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lowercase = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+-=[]{}";

    let characters = "";

    if (document.getElementById("uppercase").checked) {
        characters += uppercase;
    }

    if (document.getElementById("lowercase").checked) {
        characters += lowercase;
    }

    if (document.getElementById("numbers").checked) {
        characters += numbers;
    }

    if (document.getElementById("symbols").checked) {
        characters += symbols;
    }

    if (characters === "") {
        alert("Please select at least one option!");
        return;
    }

    let password = "";

    for (let i = 0; i < length; i++) {

        const randomIndex = Math.floor(
            Math.random() * characters.length
        );

        password += characters[randomIndex];
    }

    document.getElementById("password").value = password;
}

function copyPassword() {

    const password =
        document.getElementById("password").value;

    if (password === "") {
        alert("First generate a password!");
        return;
    }

    navigator.clipboard.writeText(password)
        .then(function() {
            alert("Password copied!");
        })
        .catch(function() {
            alert("Password copy failed. Please copy it manually.");
        });
}

</script>

</body>
</html>
