<!DOCTYPE html>
<html>
<head>
    <title>Password Generator - EasyLife</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5ff;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #0d47a1;
        }

        input {
            width: 90%;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #0d47a1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2196f3;
        }

        .back {
            background: #555;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🔐 Password Generator</h1>

    <p>Generate a strong random password</p>

    <input type="text" id="password" readonly>

    <br>

    <button onclick="generatePassword()">Generate Password</button>

    <button onclick="copyPassword()">Copy</button>

    <br>

    <button class="back" onclick="location.href='home.html'">
        ← Back to EasyLife
    </button>

</div>

<script>

function generatePassword() {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
        "abcdefghijklmnopqrstuvwxyz" +
        "0123456789" +
        "!@#$%^&*()_+";

    let password = "";

    for (let i = 0; i < 12; i++) {
        password += characters.charAt(
            Math.floor(Math.random() * characters.length)
        );
    }

    document.getElementById("password").value = password;
}

function copyPassword() {

    const password = document.getElementById("password").value;

    if (password === "") {
        alert("First generate a password!");
        return;
    }

    navigator.clipboard.writeText(password);

    alert("Password copied!");
}

</script>

</body>
</html>
