<!DOCTYPE html>
<html>
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WYXT0CE68W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WYXT0CE68W');
    </script>

    <title>EasyLife - Translator</title>

    <style> 
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        textarea {
            width: 90%;
            height: 140px;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 17px;
            resize: none;
        }

        select {
            width: 90%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 13px 25px;
            margin: 10px 5px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            min-height: 40px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🌐 Translator</h1>
        <p>Telugu ↔ English</p>
    </div>

    <div class="box">

        <textarea id="text" placeholder="Type your text here..."></textarea>

        <br>

        <select id="language">
            <option value="en">Telugu → English</option>
            <option value="te">English → Telugu</option>
        </select>

        <br>

        <button onclick="translateText()">Translate</button>

        <div id="result"></div>

        <button onclick="goHome()">🏠 Home</button>

    </div>

    <script>

        function translateText() {

            let text = document.getElementById("text").value.trim();
            let language = document.getElementById("language").value;

            if (!text) {
                alert("Please enter some text");
                return;
            }

            let url =
                "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="
                + language + "&dt=t&q=" + encodeURIComponent(text);

            fetch(url)
                .then(response => response.json())
                .then(data => {

                    let translated = "";

                    data[0].forEach(item => {
                        if (item[0]) {
                            translated += item[0];
                        }
                    });

                    document.getElementById("result").innerText = translated;

                })
                .catch(error => {
                    document.getElementById("result").innerText =
                        "Translation failed. Please check your internet connection.";
                });
        }

        function goHome() {
            window.location.href = "home.html";
        }

    </script>

</body>
</html>
