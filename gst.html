<!DOCTYPE html>
<html>
<head>
    <title>GST Calculator - EasyLife</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        input, select, button {
            margin: 10px;
            padding: 12px;
            font-size: 16px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>💰 GST Calculator</h1>
        <p>Calculate GST easily</p>
    </div>

    <div class="box">

        <h2>Enter Amount</h2>

        <input type="number" id="amount" placeholder="Enter amount">

        <br>

        <select id="gst">
            <option value="5">GST 5%</option>
            <option value="12">GST 12%</option>
            <option value="18" selected>GST 18%</option>
            <option value="28">GST 28%</option>
        </select>

        <br>

        <button onclick="calculateGST()">Calculate GST</button>

        <div id="result"></div>

    </div>

    <script>

        function calculateGST() {

            const amount = parseFloat(document.getElementById("amount").value);
            const gstRate = parseFloat(document.getElementById("gst").value);

            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            const gstAmount = amount * gstRate / 100;
            const totalAmount = amount + gstAmount;

            document.getElementById("result").innerHTML =
                "GST Amount: ₹" + gstAmount.toFixed(2) +
                "<br>Total Amount: ₹" + totalAmount.toFixed(2);

        }

    </script>

</body>
</html>
