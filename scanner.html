<!DOCTYPE html>
<html>
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WYXT0CE68W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WYXT0CE68W');
    </script>

    <title>EasyLife - Document Scanner</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 13px 25px;
            margin: 8px 5px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #preview {
            max-width: 100%;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📄 Document Scanner</h1>
        <p>Scan documents using your camera</p>
    </div>

    <div class="box">

        <input type="file" id="camera"
               accept="image/*"
               capture="environment"
               onchange="showPreview()">

        <br>

        <img id="preview">

        <br>

        <button onclick="downloadImage()">⬇️ Download Scan</button>

        <button onclick="goHome()">🏠 Home</button>

    </div>

    <script>

        function showPreview() {

            const file =
                document.getElementById("camera").files[0];

            if (!file) {
                return;
            }

            const imageURL =
                URL.createObjectURL(file);

            document.getElementById("preview").src =
                imageURL;
        }

        function downloadImage() {

            const file =
                document.getElementById("camera").files[0];

            if (!file) {
                alert("Please select or take a photo first");
                return;
            }

            const link = document.createElement("a");

            link.href =
                URL.createObjectURL(file);

            link.download =
                "EasyLife-Scanned-Document.jpg";

            link.click();
        }

        function goHome() {
            window.location.href = "home.html";
        }

    </script>

</body>
</html>
