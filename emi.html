<!DOCTYPE html>
<html>
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WYXT0CE68W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WYXT0CE68W');
    </script>

    <title>EasyLife - EMI Calculator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 13px 25px;
            margin: 10px 5px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🧮 EMI Calculator</h1>
        <p>Calculate your monthly loan EMI</p>
    </div>

    <div class="box">

        <input type="number" id="amount" placeholder="Loan Amount (₹)">

        <input type="number" id="rate" placeholder="Interest Rate (% per year)">

        <input type="number" id="months" placeholder="Loan Period (Months)">

        <br>

        <button onclick="calculateEMI()">Calculate EMI</button>

        <div id="result"></div>

        <button onclick="goHome()">🏠 Home</button>

    </div>

    <script>

        function calculateEMI() {

            let amount = Number(document.getElementById("amount").value);
            let rate = Number(document.getElementById("rate").value);
            let months = Number(document.getElementById("months").value);

            if (!amount || !rate || !months) {
                alert("Please enter all details");
                return;
            }

            let monthlyRate = rate / 12 / 100;

            let emi = amount * monthlyRate *
                Math.pow(1 + monthlyRate, months) /
                (Math.pow(1 + monthlyRate, months) - 1);

            let totalPayment = emi * months;
            let totalInterest = totalPayment - amount;

            document.getElementById("result").innerHTML =
                "💰 Monthly EMI: ₹" + emi.toFixed(2) +
                "<br>📊 Total Interest: ₹" + totalInterest.toFixed(2) +
                "<br>💵 Total Payment: ₹" + totalPayment.toFixed(2);
        }

        function goHome() {
            window.location.href = "home.html";
        }

    </script>

</body>
</html>
