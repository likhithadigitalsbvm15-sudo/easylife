<!DOCTYPE html>
<html>
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WYXT0CE68W"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WYXT0CE68W');
    </script>

    <title>QR Code Generator - EasyLife</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .box {
            background: white;
            max-width: 450px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        textarea {
            width: 90%;
            height: 100px;
            padding: 12px;
            font-size: 16px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            width: 90%;
            margin: 10px auto;
            padding: 12px;
            font-size: 16px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #125ca8;
        }

        #qrcode {
            margin-top: 20px;
        }

        #qrcode img {
            width: 250px;
            height: 250px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📱 QR Code Generator</h1>
        <p>Create QR codes easily</p>
    </div>

    <div class="box">

        <h2>Enter Text or Link</h2>

        <textarea id="text"
            placeholder="Enter text or website link"></textarea>

        <button onclick="generateQR()">
            Generate QR Code
        </button>

        <div id="qrcode"></div>

        <button id="openBtn"
            onclick="openQR()"
            style="display:none;">
            Open QR Code
        </button>

    </div>

    <script>

        let qrUrl = "";

        function generateQR() {

            const text = document.getElementById("text").value.trim();

            if (text === "") {
                alert("Please enter text or a link.");
                return;
            }

            qrUrl =
                "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
                + encodeURIComponent(text);

            document.getElementById("qrcode").innerHTML =
                "<img src='" + qrUrl + "' alt='QR Code'>";

            document.getElementById("openBtn").style.display = "block";
        }

        function openQR() {

            if (qrUrl !== "") {
                window.open(qrUrl, "_blank");
            }

        }

    </script>

</body>
</html>
