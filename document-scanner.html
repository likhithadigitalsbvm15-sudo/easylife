```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document Scanner - EasyLife</title>
    <meta name="description" content="Scan, preview and download documents with EasyLife.">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 25px 15px;
        }

        .header h1 {
            margin: 0;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            margin: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        .preview-btn {
            background: #f9a825;
        }

        .download-btn {
            background: #2e7d32;
        }

        .preview {
            display: none;
            max-width: 100%;
            margin: 20px auto;
            border-radius: 10px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #0d47a1;
            text-decoration: none;
            font-weight: bold;
        }

        #fileInput {
            display: none;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📄 Document Scanner</h1>
        <p>Scan, preview and download your document</p>
    </div>

    <div class="box">

        <input
            type="file"
            id="fileInput"
            accept="image/*"
            capture="environment"
        >

        <button onclick="selectDocument()">
            📷 Scan / Upload Document
        </button>

        <br>

        <button
            id="previewBtn"
            class="preview-btn"
            style="display:none;"
            onclick="showPreview()">
            🖼️ Preview
        </button>

        <button
            id="downloadBtn"
            class="download-btn"
            style="display:none;"
            onclick="downloadScan()">
            ⬇️ Download Scan
        </button>

        <div id="status">
            No document selected
        </div>

        <img
            id="previewImage"
            class="preview"
            alt="Document preview"
        >

        <br>

        <a class="back" href="home.html">
            ← Back to EasyLife
        </a>

    </div>

    <script>

        let selectedImageURL = "";

        function selectDocument() {
            document.getElementById("fileInput").click();
        }

        document.getElementById("fileInput").addEventListener("change", function() {

            const file = this.files[0];

            if (!file) return;

            selectedImageURL = URL.createObjectURL(file);

            document.getElementById("status").innerText =
                "Document selected: " + file.name;

            document.getElementById("previewBtn").style.display =
                "inline-block";

            document.getElementById("downloadBtn").style.display =
                "inline-block";

            document.getElementById("previewImage").src =
                selectedImageURL;

            document.getElementById("previewImage").style.display =
                "none";
        });

        function showPreview() {

            if (!selectedImageURL) {
                alert("Please select a document first.");
                return;
            }

            document.getElementById("previewImage").style.display =
                "block";
        }

        function downloadScan() {

            if (!selectedImageURL) {
                alert("Please select a document first.");
                return;
            }

            const link = document.createElement("a");

            link.href = selectedImageURL;

            link.download =
                "EasyLife-Scanned-Document.jpg";

            link.click();
        }

    </script>

</body>
</html>
```
