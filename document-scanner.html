<body>

    <div class="header">
        <h1>📄 Document Scanner</h1>
        <p>Scan, preview and download your document</p>
    </div>

    <div class="box">

        <input
            type="file"
            id="fileInput"
            accept="image/jpeg,image/png,image/jpg"
        >

        <button class="btn scan-btn" onclick="selectFile()">
            📷 Scan / Upload Document
        </button>

        <div id="message">
            No document selected
        </div>

        <img id="previewImage" alt="Document Preview">  

        <div id="cropArea"></div>
    
      <br>

    <button
    id="cropBtn"
    class="btn"
    style="background:#8e24aa;"
    onclick="cropDocument()">
    ✂️ Crop Document
</button>

        <div>
            <button
                id="previewBtn"
                class="btn preview-btn"
                style="display:none;"
                onclick="showPreview()">
                🖼️ Preview
            </button>

            <button
                id="downloadBtn"
                class="btn download-btn"
                style="display:none;"
                onclick="downloadScan()">
                ⬇️ Download Scan
            </button>
        </div>

        <a class="home-btn" href="home.html">
            🏠 Home
        </a>

    </div>

    <script>

        let selectedFile = null;
        let imageURL = "";

        function selectFile() {
            document.getElementById("fileInput").click();
        }

        document.getElementById("fileInput").addEventListener("change", function() {

            selectedFile = this.files[0];

            if (!selectedFile) {
                return;
            }

            imageURL = URL.createObjectURL(selectedFile);

            document.getElementById("message").innerText =
                "Document selected: " + selectedFile.name;

            document.getElementById("previewBtn").style.display =
                "inline-block";

            document.getElementById("downloadBtn").style.display =
                "inline-block";

            document.getElementById("previewImage").src =
                imageURL;

            document.getElementById("previewImage").style.display =
                "none";
        });

        function showPreview() {

            if (!selectedFile) {
                alert("Please select a document first.");
                return;
            }

            document.getElementById("previewImage").style.display =
                "block";
        }

        function downloadScan() {

            if (!selectedFile) {
                alert("Please select a document first.");
                return;
            }

            const link = document.createElement("a");

            link.href = imageURL;

            link.download = "EasyLife-Scanned-Document.jpg";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);
        }
      let cropStartX = 0;
let cropStartY = 0;
let cropEndX = 0;
let cropEndY = 0;
let isCropping = false;

function cropDocument() {

    if (!selectedFile) {
        alert("Please select a document first.");
        return;
    }

    const image = document.getElementById("previewImage");

    if (image.style.display === "none") {
        image.style.display = "block";
    }

    const cropArea = document.getElementById("cropArea");

    cropArea.innerHTML = "";
    cropArea.style.display = "block";

    const cropImage = document.createElement("img");

    cropImage.src = image.src;
    cropImage.style.width = "100%";
    cropImage.style.height = "100%";
    cropImage.style.objectFit = "contain";

    cropArea.appendChild(cropImage);

    alert("Crop area is ready. Select the area you want to crop.");

}
