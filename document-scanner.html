```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document Scanner - EasyLife</title>
    <meta name="description" content="Scan, preview and download documents with EasyLife.">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: white;
            padding: 30px 15px;
        }

        .header h1 {
            margin: 0;
        }

        .box {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn {
            display: inline-block;
            padding: 14px 24px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .scan-btn {
            background: #1976d2;
        }

        .preview-btn {
            background: #f9a825;
        }

        .download-btn {
            background: #2e7d32;
        }

        #fileInput {
            display: none;
        }

        #previewImage {
            display: none;
            width: 100%;
            max-width: 500px;
            margin: 25px auto;
            border-radius: 10px;
        }

        #message {
            margin: 20px 0;
            font-weight: bold;
        }

        .home-btn {
            display: inline-block;
            margin-top: 20px;
            color: #0d47a1;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📄 Document Scanner</h1>
        <p>Scan, preview and download your document</p>
    </div>

    <div class="box">

        <input
            type="file"
            id="fileInput"
            accept="image/jpeg,image/png,image/jpg"
        >

        <button class="btn scan-btn" onclick="selectFile()">
            📷 Scan / Upload Document
        </button>

        <div id="message">
            No document selected
        </div>

        <img id="previewImage" alt="Document Preview">

        <div>
            <button
                id="previewBtn"
                class="btn preview-btn"
                style="display:none;"
                onclick="showPreview()">
                🖼️ Preview
            </button>

            <button
                id="downloadBtn"
                class="btn download-btn"
                style="display:none;"
                onclick="downloadScan()">
                ⬇️ Download Scan
            </button>
        </div>

        <a class="home-btn" href="home.html">
            🏠 Home
        </a>

    </div>

    <script>

        let selectedFile = null;
        let imageURL = "";

        function selectFile() {
            document.getElementById("fileInput").click();
        }

        document.getElementById("fileInput").addEventListener("change", function() {

            selectedFile = this.files[0];

            if (!selectedFile) {
                return;
            }

            imageURL = URL.createObjectURL(selectedFile);

            document.getElementById("message").innerText =
                "Document selected: " + selectedFile.name;

            document.getElementById("previewBtn").style.display =
                "inline-block";

            document.getElementById("downloadBtn").style.display =
                "inline-block";

            document.getElementById("previewImage").src =
                imageURL;

            document.getElementById("previewImage").style.display =
                "none";
        });

        function showPreview() {

            if (!selectedFile) {
                alert("Please select a document first.");
                return;
            }

            document.getElementById("previewImage").style.display =
                "block";
        }

        function downloadScan() {

            if (!selectedFile) {
                alert("Please select a document first.");
                return;
            }

            const link = document.createElement("a");

            link.href = imageURL;

            link.download = "EasyLife-Scanned-Document.jpg";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);
        }

    </script>

</body>
</html>
